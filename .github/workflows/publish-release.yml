name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates:
    name: Publish crates.io packages
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Cargo versions
        run: |
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          cargo check --locked --workspace
      - name: Authenticate with crates.io
        id: cratesio-auth
        if: ${{ env.CRATES_IO_BOOTSTRAP_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_BOOTSTRAP_TOKEN || steps.cratesio-auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo publish --allow-dirty --locked -p starlink-core
          python3 scripts/wait-for-crate.py starlink-core "$version"
          cargo publish --allow-dirty --locked -p starlink-proto
          python3 scripts/wait-for-crate.py starlink-proto "$version"
          cargo publish --allow-dirty --locked -p starlink-cli

  binaries:
    name: Build ${{ matrix.os }} CLI
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build archive
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          cargo build --release --locked -p starlink-cli
          archive="starlink-${GITHUB_REF_NAME}-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m).tar.gz"
          tar -C target/release -czf "$archive" starlink
          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Attach binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
