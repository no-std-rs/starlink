name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  crates:
    name: Prepare crates for Runnerless
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Cargo versions
        run: |
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          cargo check --locked --workspace
      - name: Package Cargo upload requests locally
        run: |
          python3 scripts/package-registry-uploads.py dist/registry
          cd dist/registry
          sha256sum --check SHA256SUMS
      - name: Attach packages for Runnerless
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/registry/*.cargo-upload dist/registry/SHA256SUMS --repo "$GITHUB_REPOSITORY"

  binaries:
    name: Build ${{ matrix.os }} CLI
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build archive
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          cargo build --release --locked -p starlink-cli
          archive="starlink-${GITHUB_REF_NAME}-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m).tar.gz"
          tar -C target/release -czf "$archive" starlink
          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Attach binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
