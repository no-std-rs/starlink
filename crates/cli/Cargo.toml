[package]
name = "starlink-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Starlink Device API command-line client"

[lints]
workspace = true

[[bin]]
name = "starlink"
path = "src/main.rs"

[dependencies]
starlink-core = { path = "../starlink-core" }
starlink-proto = { path = "../starlink-proto" }
# Needed to encode requests / decode responses.  std is fine in the binary
# today; prost itself stays in alloc-only mode via the workspace default.
prost.workspace = true
